# スマホで あそべる サイト：プッシュの たびに gh-pages ブランチへ くみたてて おく
#   https://waisiwaisiwaisi-svg.github.io/auto-battle-game/
#   （せってい → Pages → Source を「Deploy from a branch」・gh-pages・/ (root) に して おくと こうかいされる）
name: スマホ用サイト
on:
  workflow_dispatch:
  push:
    branches: [main, claude/charming-curie-tre221]
    paths: ['index.html', 'music/**', 'se8bit/**', 'stage/**', 'web/**', 'docs/privacy.html', 'app/src/**', 'app/scripts/**', '.github/workflows/pages.yml']
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # オンライン（ランク対戦・ランキング・ギルド）：リポジトリの Secrets に FIREBASE_CONFIG（Firebase の ウェブアプリ設定の JSON）が あれば つなぐ。なければ 1人用だけ
      - name: Firebase の せってい
        env: { FIREBASE_CONFIG: '${{ secrets.FIREBASE_CONFIG }}' }
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then printf 'window.PMA_FIREBASE_CONFIG = %s;\n' "$FIREBASE_CONFIG" > app/firebase-config.js; echo "オンライン あり"; else echo "オンライン なし（1人用）"; fi
      - name: サイトを くみたてる
        run: |
          (cd app && npm ci --no-audit --no-fund && node scripts/build-web.mjs)
          mkdir -p _site
          cp -r app/www/. _site/
          cp web/* _site/
          cp docs/privacy.html _site/privacy.html
          touch _site/.nojekyll
          SHORT=$(git rev-parse --short HEAD); DATE=$(TZ=Asia/Tokyo date '+%m/%d %H:%M')
          # ホームがめんに ついか した とき アプリの ように ひらく（アイコン・ぜんがめん）・タイトルに いつの はんか を だす
          sed -i "s#<meta name=\"theme-color\" content=\"\#141022\">#<meta name=\"theme-color\" content=\"\#141022\"><link rel=\"manifest\" href=\"manifest.webmanifest\"><link rel=\"icon\" type=\"image/png\" href=\"icon-192.png\"><link rel=\"apple-touch-icon\" href=\"apple-touch-icon.png\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"apple-mobile-web-app-title\" content=\"モンスターアリーナ\">#" _site/index.html
          sed -i "s#>ver 1.0<#>ver 1.0（${DATE}・${SHORT}）<#" _site/index.html
          grep -q 'rel="manifest"' _site/index.html
      - name: gh-pages に おく
        working-directory: _site
        env: { TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -qm "サイト ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
