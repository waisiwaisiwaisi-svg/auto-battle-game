# iOS：いつもは シミュレータ用に ビルドできるか だけ たしかめる。
# 署名の シークレットが そろっていれば、App Store 用に 書き出して TestFlight に アップロードする。
name: iOS アプリ
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'app/**', '.github/workflows/app-ios.yml']
jobs:
  build:
    runs-on: macos-15
    defaults: { run: { working-directory: app } }
    env:
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Firebase の 設定
        env: { FIREBASE_CONFIG_JS: '${{ secrets.FIREBASE_CONFIG_JS }}' }
        run: if [ -n "$FIREBASE_CONFIG_JS" ]; then printf '%s' "$FIREBASE_CONFIG_JS" > firebase-config.js; fi
      - run: npm run build && npx cap sync ios
      - name: シミュレータ用 ビルド（署名なし）
        if: env.HAS_SIGNING != 'true'
        working-directory: app/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: 証明書と プロファイル
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain; security create-keychain -p ci "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC"; security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/pma.mobileprovision
      - name: アーカイブして TestFlight へ
        if: env.HAS_SIGNING == 'true'
        working-directory: app/ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -20
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>com.waisi.pixelmonsterarena</key><string>$PROFILE_NAME</string></dict></dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out
          mkdir -p ~/.appstoreconnect/private_keys; echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/out/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
