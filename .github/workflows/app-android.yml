# Android：むしょめい なら テスト用 APK、署名の シークレットが あれば Google Play 用の AAB を つくる
name: Android アプリ
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'stage/**', 'app/**', '.github/workflows/app-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Firebase の 設定
        env: { FIREBASE_CONFIG_JS: '${{ secrets.FIREBASE_CONFIG_JS }}' }
        run: if [ -n "$FIREBASE_CONFIG_JS" ]; then printf '%s' "$FIREBASE_CONFIG_JS" > firebase-config.js; fi
      - run: npm run build && npx cap sync android
      - name: 署名かぎ
        id: ks
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"; fi
      - name: ビルド
        working-directory: app/android
        env:
          PMA_KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          PMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PMA_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$PMA_KEYSTORE_FILE" ]; then ./gradlew bundleRelease assembleRelease; else ./gradlew assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/**/*.apk
