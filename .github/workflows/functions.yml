# サーバーの しごと（Cloud Functions）：本番に あげた とき、さいげん用の ゲーム（functions/game/index.html）を いまの ゲームに そろえて くばりなおす
#   ゲームが かわるたびに くばりなおさないと、オンライン対戦の さいげんが「ちがう バージョン」に なって たしかめられない
# うごく じょうけん（どちらか かけて いれば なにも しない）：
#   - index.html が SRV_FN_ON = true（Firebase を Blaze プランに して サーバーを つかう とき：docs/RELEASE.md の 5）
#   - リポジトリの Secrets に FIREBASE_SERVICE_ACCOUNT（サービスアカウントの JSON）と FIREBASE_PROJECT_ID
name: サーバー（Functions）
on:
  workflow_dispatch:
  push:
    branches: [claude/charming-curie-tre221]
    paths: ['index.html', 'app/functions/**', 'app/scripts/build-functions.mjs', 'app/scripts/game-ver.mjs', 'app/firebase.json', '.github/workflows/functions.yml']
concurrency:
  group: functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: つかう かどうか
        id: on
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if ! grep -q "const SRV_FN_ON = true" index.html; then echo "SRV_FN_ON が false：サーバーは つかって いない（くばらない）"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$SA" ] || [ -z "$PID" ]; then echo "::warning::SRV_FN_ON は true なのに FIREBASE_SERVICE_ACCOUNT／FIREBASE_PROJECT_ID が ない：サーバーを くばれません"; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.on.outputs.go == '1'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: くばる（predeploy で functions/game/index.html を つくる）
        if: steps.on.outputs.go == '1'
        working-directory: app
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npm ci --no-audit --no-fund
          (cd functions && npm ci --no-audit --no-fund)
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only functions --project "$PID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
